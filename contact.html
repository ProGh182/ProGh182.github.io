    <script>
  const hamidButtons = document.querySelectorAll('.hamid');
  const pageContent = document.getElementById('page-content');

  hamidButtons.forEach(button => {
    button.addEventListener('mouseenter', () => {
      pageContent.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
      pageContent.style.filter = 'brightness(50%)';
    });

    button.addEventListener('mouseleave', () => {
      pageContent.style.backgroundColor = '';
      pageContent.style.filter = 'brightness(100%)';
    });
  });

  const button = document.getElementById('hamidButton1');
  const section = document.getElementById('about');

  button.addEventListener('click', () => {
    section.style.display = 'block';
    section.style.opacity = '0';
    setTimeout(() => {
      section.style.opacity = '1';
    }, 10);
  });
